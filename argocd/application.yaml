apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-manager-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Harrys-Kouam/manifests-liora.git
    targetRevision: main
    path: helm/task-manager-api
    helm:
      releaseName: task-manager-api
  destination:
    server: https://kubernetes.default.svc
    namespace: task-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
