apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-manager-api.fullname" . }}
  labels:
    {{- include "task-manager-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "task-manager-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-manager-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.api.nodeEnv | quote }}
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: MONGODB_URI
              value: "mongodb://{{ include "task-manager-api.fullname" . }}-mongodb:27017/{{ .Values.mongodb.database }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.jwtSecret.secretName | quote }}
                  key: {{ .Values.api.jwtSecret.key | quote }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
